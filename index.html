<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pharma Intelligence Hub · Evidence Intelligence (Concept Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F8F9FB;
  --ink:#0F1E33; --ink-2:#2C3C53; --muted:#5B6A7E; --faint:#8492A5;
  --line:#DEE3EA; --line-strong:#C6CED9;
  --navy:#14284B; --navy-hover:#0D1E3B; --on-navy:#FFFFFF; --navy-soft:#E6EBF3;
  --blue:#245A9E; --blue-bg:#E8EFF9;
  --red:#9E2B2B; --red-bg:#F8E9E7;
  --amber:#875600; --amber-bg:#FBF0D9;
  --green:#1F6647; --green-bg:#E3F1E9;
  --gray-bg:#EBEEF3;
  --focus:#2F6FD1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1320; --surface:#111B2C; --surface-2:#152134;
    --ink:#E8EDF5; --ink-2:#C5CFDD; --muted:#95A3B7; --faint:#6F7F95;
    --line:#233248; --line-strong:#33465F;
    --navy:#3B6BB5; --navy-hover:#4A7ACA; --on-navy:#FFFFFF; --navy-soft:#1B2B45;
    --blue:#83B1F2; --blue-bg:#15263F;
    --red:#F09B94; --red-bg:#3A1F22;
    --amber:#EBBA5E; --amber-bg:#372B13;
    --green:#72CFA0; --green-bg:#133025;
    --gray-bg:#1A2739;
    --focus:#7FB0FF;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1320; --surface:#111B2C; --surface-2:#152134;
  --ink:#E8EDF5; --ink-2:#C5CFDD; --muted:#95A3B7; --faint:#6F7F95;
  --line:#233248; --line-strong:#33465F;
  --navy:#3B6BB5; --navy-hover:#4A7ACA; --on-navy:#FFFFFF; --navy-soft:#1B2B45;
  --blue:#83B1F2; --blue-bg:#15263F;
  --red:#F09B94; --red-bg:#3A1F22;
  --amber:#EBBA5E; --amber-bg:#372B13;
  --green:#72CFA0; --green-bg:#133025;
  --gray-bg:#1A2739;
  --focus:#7FB0FF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p,dl,dd,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:56px;display:flex;align-items:center;gap:20px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px;white-space:nowrap}
.brand b{font-weight:600;font-size:15px;letter-spacing:-.005em}
.brand span{color:var(--muted);font-size:13px;padding-left:12px;border-left:1px solid var(--line-strong)}
.search{position:relative;flex:1;max-width:400px;margin-left:auto}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search input{width:100%;height:34px;padding:0 10px 0 33px;border:1px solid var(--line-strong);border-radius:5px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:13px}
.search input::placeholder{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border:1px solid var(--amber);border-radius:999px;background:var(--amber-bg);color:var(--amber);font-size:12px;font-weight:500;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);align-items:start}
.rail{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));padding:24px 16px 24px 20px;border-right:1px solid var(--line);min-height:calc(100vh - 56px);background:var(--surface)}
.rail-asset{padding-bottom:16px;border-bottom:1px solid var(--line)}
.rail-asset .id{font-size:20px;font-weight:600;letter-spacing:-.01em}
.rail-asset .m{color:var(--muted);font-size:12.5px;margin-top:2px}
.nav{margin:14px -8px 0;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:8px 10px;border:0;border-radius:5px;background:transparent;text-align:left;color:var(--ink-2);font-size:14px}
.nav button:hover{background:var(--gray-bg)}
.nav button[aria-current="page"]{background:var(--navy-soft);color:var(--ink);font-weight:600}
.nav .n{font-size:12px;color:var(--muted);font-weight:500}
.rail-block{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.rail-block h3{font-size:12.5px;font-weight:500;color:var(--muted);margin-bottom:6px}
.rail-block p{font-size:13px;color:var(--ink-2)}
.seg{display:flex;gap:3px;margin:8px 0 6px}
.seg i{flex:1;height:6px;border-radius:2px;background:var(--gray-bg);border:1px solid var(--line)}
.seg i.on{background:var(--navy);border-color:var(--navy)}
.rail-note{font-size:12px;color:var(--muted);line-height:1.45}

main{padding:32px 40px 24px;min-width:0;outline:none}
.wrap{max-width:1120px}
.footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;max-width:74ch}

/* ---------- Generic ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border:1px solid var(--navy);border-radius:5px;background:var(--navy);color:var(--on-navy);font-weight:500;font-size:14px}
.btn:hover{background:var(--navy-hover)}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.sec:hover{background:var(--gray-bg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--blue);text-align:left;font-weight:500}
.link:hover{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500;line-height:1.5;white-space:nowrap;background:var(--gray-bg);color:var(--ink-2)}
.chip.red{background:var(--red-bg);color:var(--red)}
.chip.amber{background:var(--amber-bg);color:var(--amber)}
.chip.green{background:var(--green-bg);color:var(--green)}
.chip.blue{background:var(--blue-bg);color:var(--blue)}
.chip.gray{background:var(--gray-bg);color:var(--muted)}
.chip.navy{background:var(--navy);color:var(--on-navy)}
.chip.outline{background:transparent;border:1px solid var(--line-strong);color:var(--muted)}
.chip.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:7px;vertical-align:-1px}
.bars i{width:4px;background:var(--line-strong);border-radius:1px}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8px}.bars i:nth-child(3){height:12px}
.bars.red i.on{background:var(--red)}
.bars.amber i.on{background:var(--amber)}
.bars.gray i.on{background:var(--faint)}
.bars.navy i.on{background:var(--navy)}
.tone-mute{color:var(--muted)}
.h1{font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.015em}
.lede{color:var(--ink-2);font-size:14.5px;max-width:72ch;margin-top:8px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:10px}
.sec-h h2{font-size:16px;font-weight:600;letter-spacing:-.005em}
.sec-h p{color:var(--muted);font-size:12.5px}
.section{margin-top:44px}

/* ---------- Overview ---------- */
.ov-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.ov-head h1{font-size:34px;line-height:1.1;font-weight:600;letter-spacing:-.02em}
.ov-head h1 span{font-weight:400;color:var(--muted);margin-left:8px}
.ov-meta{margin-top:10px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 24px;font-size:13.5px}
.ov-meta b{font-weight:500;color:var(--muted);margin-right:6px}
.statement{margin-top:30px;font-size:22px;line-height:1.38;font-weight:500;letter-spacing:-.01em;max-width:34em;color:var(--ink)}
.path{margin-top:28px;display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.stage{position:relative;padding:16px 18px 16px;border-right:1px solid var(--line)}
.stage:last-child{border-right:0;background:var(--navy-soft);border-radius:0 5px 5px 0}
.stage:not(:last-child)::after{content:"";position:absolute;right:-6px;top:50%;width:11px;height:11px;background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line);transform:translateY(-50%) rotate(45deg);z-index:1}
.stage .lb{font-size:13px;font-weight:600}
.stage .num{font-size:30px;line-height:1.15;font-weight:500;letter-spacing:-.02em;margin:6px 0 2px}
.stage .num small{font-size:16px;color:var(--muted);font-weight:400}
.stage .cp{font-size:12.5px;color:var(--muted);line-height:1.4}
.path-note{margin-top:8px;font-size:12.5px;color:var(--muted);max-width:80ch}
.two{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:40px;align-items:start}
.rows{border-top:1px solid var(--line-strong)}
.rows>li{border-bottom:1px solid var(--line)}
.rowbtn{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:13px 4px;border:0;background:none;text-align:left}
.rowbtn:hover{background:var(--surface)}
.rowbtn .t{font-weight:500}
.rowbtn .w{color:var(--muted);font-size:13px;margin-top:1px}
.rowbtn .go{color:var(--faint);display:flex}
.prof .rowbtn{grid-template-columns:10px minmax(0,1fr) auto auto}
.prof .dotc{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.prof .dotc.red{background:var(--red)}.prof .dotc.amber{background:var(--amber)}.prof .dotc.green{background:var(--green)}.prof .dotc.blue{background:var(--blue)}.prof .dotc.navy{background:var(--navy)}
.prof .cnt{font-size:18px;font-weight:500;min-width:1.5em;text-align:right}
.q-row{padding:16px 0;border-bottom:1px solid var(--line)}
.q-row:first-child{border-top:1px solid var(--line-strong)}
.q-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.q-head .qt{font-weight:600}
.q-head .qt span{color:var(--muted);font-weight:500;margin-right:8px}
.q-obj{color:var(--muted);font-size:13px;margin-top:2px}
.q-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.q-pill{display:inline-flex;align-items:center;padding:5px 10px;border:1px solid var(--line-strong);border-radius:5px;background:var(--surface);font-size:12.5px}
.q-pill:hover{border-color:var(--navy)}
.q-pill.base{border-style:dashed;color:var(--muted);background:transparent;cursor:default}
.q-pill.base:hover{border-color:var(--line-strong)}

/* ---------- Monitor ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.fchip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);font-size:13px;color:var(--ink-2)}
.fchip .c{color:var(--muted);font-size:12px}
.fchip:hover{border-color:var(--navy)}
.fchip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.fchip[aria-pressed="true"] .c{color:inherit;opacity:.8}
.fhint{margin-top:12px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;min-height:22px}
.tablewrap{margin-top:12px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{width:100%;min-width:980px;border-collapse:collapse}
th{padding:10px 12px;text-align:left;font-size:12.5px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line-strong);background:var(--surface-2);white-space:nowrap}
td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13.5px}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.rowlink{border:0;background:none;padding:0;text-align:left;font-weight:600;color:var(--ink);line-height:1.35}
.rowlink:hover{text-decoration:underline}
.esub{display:flex;flex-wrap:wrap;gap:0 14px;margin-top:3px;color:var(--muted);font-size:12.5px}
.c-ev{min-width:290px}
.mat-h{font-weight:600}
.mat-p{font-weight:400}
.mat-n{color:var(--muted)}
.mat-x{color:var(--muted);font-style:italic}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* ---------- Investigation ---------- */
.inv-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.crumb{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);padding:4px 0}
.crumb:hover{color:var(--ink)}
.pager{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.pager button{height:30px;padding:0 12px;border:1px solid var(--line-strong);border-radius:5px;background:var(--surface);font-size:13px}
.pager button:hover:not([disabled]){border-color:var(--navy)}
.pager button[disabled]{opacity:.4;cursor:not-allowed}
.inv-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;align-items:start}
.inv-rail{position:sticky;top:calc(56px + env(safe-area-inset-top,0px) + 20px);max-height:calc(100vh - 56px - 40px - env(safe-area-inset-top,0px));overflow-y:auto}
.inv-head .tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.inv-head h1{font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.015em}
.inv-sub{font-size:16px;color:var(--ink-2);margin-top:6px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 24px;margin-top:20px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.meta dt{font-size:12px;color:var(--muted);margin-bottom:1px}
.meta dd{font-size:13.5px;font-weight:500}
.prose{font-size:15px;line-height:1.6;max-width:70ch;color:var(--ink)}
.datanote{margin-top:12px;padding:8px 12px;border-left:3px solid var(--amber);background:var(--amber-bg);color:var(--ink-2);font-size:13px;max-width:70ch}

/* signature panel */
.why{border:1px solid var(--navy);border-radius:6px;background:var(--surface);overflow:hidden}
.why-h{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 18px;background:var(--navy);color:var(--on-navy)}
.why-h h2{font-size:17px;font-weight:600}
.why-h .sub{font-size:12.5px;opacity:.78;margin-top:1px}
.why-t{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border:1px solid rgba(255,255,255,.55);border-radius:5px;background:transparent;color:inherit;font-size:13.5px;font-weight:500}
.why-t:hover{background:rgba(255,255,255,.12)}
.why-t svg{transition:transform .2s}
.why.open .why-t svg{transform:rotate(180deg)}
.why-b{padding:18px 20px 20px}
.why-b .prose{font-size:14.5px}
.chain{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px;margin-top:20px}
.chain li{position:relative;padding:10px 11px;border:1px solid var(--line-strong);border-radius:5px;background:var(--surface-2);min-height:88px}
.chain li:not(:last-child)::after{content:"";position:absolute;right:-13px;top:50%;width:8px;height:8px;border-top:2px solid var(--faint);border-right:2px solid var(--faint);transform:translateY(-50%) rotate(45deg)}
.chain li:last-child{border-color:var(--navy);background:var(--navy-soft)}
.chain .k{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.chain .v{font-size:12.5px;font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.why-x{display:none;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.why.open .why-x{display:block}
.why-x h3{font-size:14px;font-weight:600;margin-bottom:12px}
.steps{position:relative;margin-left:2px}
.steps li{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:0 14px;padding:0 0 18px}
.steps li:not(:last-child)::before{content:"";position:absolute;left:13.5px;top:28px;bottom:0;width:1px;background:var(--line-strong)}
.steps .no{width:28px;height:28px;border-radius:50%;border:1px solid var(--navy);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;background:var(--surface);position:relative;z-index:1}
.steps li:last-child .no{background:var(--navy);color:var(--on-navy)}
.steps .st{font-weight:600;font-size:14px;line-height:28px}
.steps .sd{grid-column:2;color:var(--ink-2);font-size:13.5px;max-width:66ch;margin-top:-2px}
.steps .sd em{display:block;font-style:normal;color:var(--muted);margin-top:3px}
.steps .src{font-size:12px;color:var(--muted);line-height:28px;white-space:nowrap}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.why.open.anim .steps li{animation:rise .3s ease both;animation-delay:calc(var(--i) * 70ms)}

/* materiality */
.mat-list{border-top:1px solid var(--line-strong)}
.mat-list>div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;padding:11px 0;border-bottom:1px solid var(--line)}
.mat-list dt{font-weight:500;color:var(--ink-2)}
.mat-list dd{color:var(--ink);max-width:68ch}
.mat-list dd small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.mat-note{margin-top:10px;font-size:12.5px;color:var(--muted);max-width:74ch}

/* compare */
.compare{display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);align-items:stretch}
.cmp{padding:16px 18px;border:1px solid var(--line-strong);border-radius:6px}
.cmp.prev{background:var(--surface-2);border-style:dashed}
.cmp.curr{background:var(--surface);border-color:var(--navy)}
.cmp h3{font-size:14px;font-weight:600}
.cmp .snap{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.cmp dl>div{padding:9px 0;border-top:1px solid var(--line)}
.cmp dt{font-size:12px;color:var(--muted);margin-bottom:2px}
.cmp dd{font-size:13.5px}
.cmp dd .lst>div+div{margin-top:8px}
.cmp dd .ft{color:var(--muted);display:block}
.cmp-mid{display:flex;align-items:center;justify-content:center;color:var(--faint)}
.detected{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:14px;padding:11px 16px;border-left:3px solid var(--navy);background:var(--navy-soft)}
.detected b{font-weight:600}
.detected .arrow{display:inline-flex;align-items:center;gap:8px}

/* lineage */
.lin-tools{display:flex;justify-content:flex-end;margin-bottom:4px}
.lin{position:relative}
.lin>li{position:relative;display:grid;grid-template-columns:150px 26px minmax(0,1fr);gap:0 14px;padding-bottom:18px}
.lin>li:not(:last-child) .rail-l::after{content:"";position:absolute;left:50%;top:14px;bottom:-18px;width:1px;background:var(--line-strong)}
.lin .lab{font-weight:500;color:var(--ink-2);padding-top:1px}
.rail-l{position:relative;display:flex;justify-content:center}
.rail-l i{position:relative;z-index:1;width:11px;height:11px;margin-top:5px;border-radius:50%;border:2px solid var(--navy);background:var(--surface)}
.lin>li:last-child .rail-l i{background:var(--navy)}
.lin .main{font-weight:500}
.lin .sub{color:var(--muted);font-size:13px;margin-top:1px;max-width:66ch}
.lin .tg{margin-top:6px;border:0;background:none;padding:0;color:var(--blue);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.lin .tg svg{transition:transform .2s}
.lin .tg[aria-expanded="true"] svg{transform:rotate(180deg)}
.lin .det{margin-top:8px;padding:10px 14px;border:1px solid var(--line);border-radius:5px;background:var(--surface-2);max-width:70ch}
.lin .det[hidden]{display:none}
.lin .det dl>div{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;padding:5px 0;font-size:13px}
.lin .det dt{color:var(--muted)}
.rel{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.rel h4{margin:0 0 4px;font-size:12.5px;font-weight:500;color:var(--muted)}
.rel li{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:13px}

/* review panel */
.review{border:1px solid var(--line-strong);border-radius:6px;background:var(--surface)}
.review .rh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.review .rh h2{font-size:15px;font-weight:600}
.review .rb{padding:14px 18px 18px}
.review dl>div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13.5px}
.review dt{color:var(--muted)}
.review dd{font-weight:500;text-align:right}
.focus{margin:12px 0;padding:11px 13px;border-left:3px solid var(--blue);background:var(--blue-bg)}
.focus h3{font-size:12.5px;font-weight:500;color:var(--muted);margin-bottom:3px}
.focus p{font-size:13.5px;color:var(--ink)}
fieldset{margin:14px 0 0;padding:0;border:0;min-width:0}
legend{padding:0;font-size:13px;font-weight:600;margin-bottom:6px}
.opt{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:4px;border:1px solid var(--line);border-radius:5px;cursor:pointer;font-size:13.5px}
.opt:hover{border-color:var(--navy)}
.opt input{accent-color:var(--navy);margin:0;width:15px;height:15px}
.opt:has(input:checked){border-color:var(--navy);background:var(--navy-soft);font-weight:500}
.notes{margin-top:12px}
.notes label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.notes textarea{width:100%;min-height:92px;resize:vertical;padding:9px 10px;border:1px solid var(--line-strong);border-radius:5px;background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px}
.review .acts{display:flex;gap:8px;margin-top:12px}
.review .fine{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.45}
.saved{margin-top:10px;font-size:12.5px;color:var(--green)}

/* brief */
.brief{max-width:900px}
.brief-h{padding-bottom:20px;border-bottom:1px solid var(--line-strong)}
.brief-h .for{color:var(--muted);margin-top:6px;font-size:14.5px}
.disclaimer{margin-top:16px;padding:10px 14px;border-left:3px solid var(--amber);background:var(--amber-bg);font-size:13px;color:var(--ink-2);max-width:74ch}
.exec p{font-size:15.5px;line-height:1.6;max-width:70ch}
.exec p+p{margin-top:10px}
.tally{display:flex;flex-wrap:wrap;gap:0;margin-top:16px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.tally div{padding:10px 16px;border-right:1px solid var(--line);min-width:120px}
.tally div:last-child{border-right:0}
.tally b{display:block;font-size:20px;font-weight:500}
.tally span{font-size:12.5px;color:var(--muted)}
.grp{margin-top:40px}
.grp>h2{font-size:16px;font-weight:600}
.grp>p{color:var(--muted);font-size:13px;margin-top:2px}
.bi{margin-top:14px;padding:16px 0;border-top:1px solid var(--line-strong)}
.bi-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.bi-h .link{font-size:15.5px;font-weight:600;color:var(--ink);line-height:1.35}
.bi-h .link:hover{text-decoration:underline}
.bi-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bi dl{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 20px;margin-top:12px}
.bi dt{color:var(--muted);font-size:13px}
.bi dd{font-size:14px;max-width:68ch}
.bi dd .note{display:block;margin-top:6px;padding:6px 10px;border-left:2px solid var(--line-strong);color:var(--ink-2);font-size:13px}
.compact{margin-top:10px;border-top:1px solid var(--line-strong)}
.compact li{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.5fr) auto;gap:16px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.compact .why-s{color:var(--muted)}

@media (max-width:1100px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;min-height:0;border-right:0;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center}
  .rail-asset{padding:0;border:0;display:flex;align-items:baseline;gap:12px}
  .nav{flex-direction:row;margin:0;gap:4px}
  .nav button{width:auto;gap:10px}
  .rail-block{margin:0;padding:0;border:0}
  .rail-note{display:none}
  main{padding:26px 24px 24px}
  .inv-grid{grid-template-columns:minmax(0,1fr)}
  .inv-rail{position:static;max-height:none;overflow:visible}
  .two{grid-template-columns:minmax(0,1fr);gap:36px}
  .chain{grid-template-columns:repeat(3,minmax(0,1fr))}
  .chain li:nth-child(3)::after{display:none}
  .path{grid-template-columns:repeat(3,1fr)}
  .stage:nth-child(3){border-right:0}
  .stage:nth-child(-n+3){border-bottom:1px solid var(--line)}
  .stage:nth-child(3)::after{display:none}
  .stage:last-child{border-radius:0 0 5px 0}
}
@media (max-width:760px){
  .topbar{gap:10px;padding:0 12px}
  .brand span{display:none}
  .badge{font-size:11px;padding:3px 8px}
  .ov-head{flex-direction:column}
  .chain{grid-template-columns:minmax(0,1fr)}
  .chain li::after{display:none}
  .compare{grid-template-columns:minmax(0,1fr)}
  .cmp-mid{transform:rotate(90deg);padding:6px 0}
  .lin>li{grid-template-columns:22px minmax(0,1fr)}
  .lin .lab{grid-column:2;grid-row:1}
  .lin .rail-l{grid-column:1;grid-row:1 / span 2}
  .lin .body{grid-column:2}
  .bi dl{grid-template-columns:minmax(0,1fr);gap:2px}
  .bi dt{margin-top:8px}
  .compact li{grid-template-columns:minmax(0,1fr)}
  .mat-list>div{grid-template-columns:minmax(0,1fr);gap:2px}
  .path{grid-template-columns:repeat(2,1fr)}
  .stage{border-right:0!important;border-bottom:1px solid var(--line)}
  .stage::after{display:none!important}
}
@media print{
  .topbar,.rail,.inv-rail,.filters{display:none}
  .shell{display:block}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

 'E-008':{short:'Post-treatment safety observation',headline:'Material potential conflict',tone:'red',tags:['conflict'],ctx:['Safety / benefit-risk'],phrase:'a potential safety conflict',

/* ---------- build evidence items ---------- */
const ITEMS = D.sources.map(s => {
  const f = D.findings.find(x => x.Evidence_ID === s.Evidence_ID) || {};
  const st = D.states.filter(x => x.Evidence_ID === s.Evidence_ID);
  const pr = st.find(x => x.Snapshot_Date === PREV), cr = st.find(x => x.Snapshot_Date === CURR);
  const gt = D.gt.find(x => x.Evidence_ID === s.Evidence_ID) || null;
  const a = A[s.Evidence_ID] || {short:s.Title, tags:[], ctx:[], tone:'gray'};
  return Object.assign({
    id:s.Evidence_ID, type:s.Evidence_Type, title:s.Title, org:s.Source_Organization, date:s.Publication_Date,
    srcType:s.Source_Type, reliability:s.Source_Reliability,
    population:f.Population, focus:f.Endpoint_or_Focus, finding:f.Finding, strength:f.Evidence_Strength,
    prev: pr ? pr.State : null, curr: cr ? cr.State : null, eq: (cr||pr).Relevant_Question,
    assessed: !!gt,
    changeType: gt ? gt.Change_Type : (cr ? cr.State : ''),
    sev: gt ? gt.Change_Severity : null, mat: gt ? gt.Materiality : null,
    why: gt ? gt.Why_This_Matters : null, impact: gt ? gt.Potential_Impact : null,
    conf: gt ? gt.AI_Confidence : null, review: gt ? gt.Human_Review : null
  }, a);
});
const BYID = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const CHANGED = ITEMS.filter(i => i.curr !== 'Existing');          // changed since the previous snapshot
const REQUESTED = CHANGED.filter(i => i.review === 'Yes');          // human review requested
const isMaterial = i => i.mat === 'Material' || i.mat === 'Potentially material';
const sevRank = i => ({High:0, Medium:1, Low:3}[i.sev] ?? 2);
const SORTED = CHANGED.slice().sort((a,b) => sevRank(a)-sevRank(b) || pd(b.date)-pd(a.date));

/* ---------- filters ---------- */
const FILTERS = [
 {k:'all', label:'All', test:()=>true, hint:`Everything that changed between ${fd(PREV)} and ${fd(CURR)}.`},
 {k:'material', label:'Material', test:isMaterial, hint:'Assessed as Material or Potentially material.'},
 {k:'high', label:'High severity', test:i=>i.sev==='High', hint:'Change severity assessed as High.'},
 {k:'conflict', label:'Potential conflict', test:i=>i.tags.includes('conflict'), hint:'New evidence differs from the existing evidence profile.'},
 {k:'strengthened', label:'Strengthened', test:i=>i.tags.includes('strengthened'), hint:'Existing evidence supported by additional evidence. Items without an assessment in the dataset show Not assessed.'},
 {k:'gap', label:'Gap reduced', test:i=>i.tags.includes('gap'), hint:'New evidence potentially addresses a previously identified evidence gap.'},
 {k:'competitive', label:'Competitive', test:i=>i.tags.includes('competitive'), hint:'Competitor evidence relevant to an active evidence question.'},
 {k:'regulatory', label:'Regulatory', test:i=>i.tags.includes('regulatory'), hint:'Regulatory or external context has changed.'},
 {k:'patient', label:'Patient', test:i=>i.tags.includes('patient'), hint:'Patient-focused evidence, linked to EQ-004 (treatment persistence and patient experience).'},
 {k:'lowrel', label:'Low relevance', test:i=>i.tags.includes('lowrel'), hint:'Detected, but not materially related to the active evidence context.'}
];
const FBY = Object.fromEntries(FILTERS.map(f => [f.k, f]));

function haystack(i){
  const q = Q[i.eq];
  return [i.id,i.title,i.short,i.org,i.type,i.srcType,i.population,i.focus,i.finding,i.eq,q.Evidence_Question,i.changeType,i.mat,i.sev,
          i.headline,(i.ctx||[]).join(' '),i.impact,i.why,i.curr].filter(Boolean).join(' ').toLowerCase();
}
function results(){
  const toks = S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return SORTED.filter(i => FBY[S.filter].test(i) && toks.every(t => haystack(i).includes(t)));
}

/* ---------- reviews & state ---------- */
const STORE = 'pih-reviews-v1';
function loadReviews(){ try{ const v = localStorage.getItem(STORE); return v ? JSON.parse(v) : {}; }catch(e){ return {}; } }
function persist(){ try{ localStorage.setItem(STORE, JSON.stringify(S.reviews)); }catch(e){} }

const DISP = {
  confirm:{label:'Confirm material', status:'Confirmed material', chip:'navy'},
  notmat:{label:'Not material', status:'Marked not material', chip:'gray'},
  investigate:{label:'Investigate further', status:'Investigating further', chip:'blue'},
  defer:{label:'Defer', status:'Deferred', chip:'outline'}
};
function statusOf(i){
  const r = S.reviews[i.id];
  if (r && DISP[r.disp]) return {label:DISP[r.disp].status, chip:DISP[r.disp].chip, done:true};
  if (!i.assessed) return {label:'Not assessed', chip:'gray'};
  return i.review === 'Yes' ? {label:'Awaiting review', chip:'amber dot'} : {label:'Review not requested', chip:'gray'};
}
const statusChip = i => { const s = statusOf(i); return `<span class="chip ${s.chip}">${esc(s.label)}</span>`; };
const reviewedCount = () => REQUESTED.filter(i => S.reviews[i.id]).length;

/* ---------- small view atoms ---------- */
const barsFor = (lvl, tone) => { const n = {High:3, Medium:2, Moderate:2, Low:1}[lvl] || 0; return `<span class="bars ${tone}" aria-hidden="true">${[1,2,3].map(k=>`<i class="${k<=n?'on':''}"></i>`).join('')}</span>`; };
const sevTone = l => ({High:'red', Medium:'amber', Low:'gray'}[l] || 'gray');
const sevCell = i => i.sev ? `${barsFor(i.sev, sevTone(i.sev))}${esc(i.sev)}` : `<span class="tone-mute">Not assessed</span>`;
const strCell = i => `${barsFor(i.strength,'navy')}${esc(i.strength)}`;
const matCell = i => !i.mat ? `<span class="mat-x">Not assessed</span>` : i.mat==='Material' ? `<span class="mat-h">Material</span>` : i.mat==='Potentially material' ? `<span class="mat-p">Potentially material</span>` : `<span class="mat-n">Not material</span>`;
const typeChip = i => `<span class="chip ${i.tone}">${esc(i.changeType)}</span>`;
const ctxCell = i => !i.ctx.length ? '<span class="tone-mute">None active</span>' : esc(i.ctx[0]) + (i.ctx.length>1 ? ` <span class="tone-mute">+${i.ctx.length-1}</span>` : '');
function ctxBasis(i){
  if (!i.ctx.length) return 'No active decision context is linked to this signal.';
  const q = Q[i.eq];
  return `Mapped from the linked question’s decision objective (“${q.Decision_Objective}”)` + (i.assessed ? ` and the assessed potential impact (“${i.impact}”).` : '.');
}
const listAnd = arr => arr.length<2 ? arr.join('') : arr.slice(0,-1).join(', ') + ' and ' + arr[arr.length-1];

function reasoningSteps(i){
  const q = Q[i.eq], low = i.tags.includes('lowrel');
  const trans = i.prev ? `“${i.prev}” at ${fd(PREV)}, “${i.curr}” at ${fd(CURR)}` : `no snapshot recorded at ${fd(PREV)}, “${i.curr}” at ${fd(CURR)}`;
  const st = statusOf(i);
  return [
   {t:'New evidence detected', d:`${esc(i.title)} was published ${fd(i.date)}. State: ${esc(trans)}.`, s:'Evidence state'},
   {t:'Evidence connected to an existing question',
    d: low ? `Nominally associated with ${esc(q.Question_ID)} “${esc(q.Evidence_Question)}”. Finding: “${esc(i.finding)}”`
           : `Linked to ${esc(q.Question_ID)} “${esc(q.Evidence_Question)}”. Population: ${esc(i.population)}. Focus: ${esc(i.focus)}.`, s:'Evidence question'},
   {t:'Evidence state changed', d:`${i.prev ? esc(i.prev) : 'No prior snapshot'} → ${esc(i.curr)}. Change type: ${esc(i.changeType)}.`, s:'Evidence state'},
   {t:'Evidence strength assessed', d:`Finding strength: ${esc(i.strength)}. Source reliability: ${esc(i.reliability)} (${esc(i.srcType)}).`, s:'Evidence finding'},
   {t:'Decision context identified', d: i.ctx.length ? `${esc(listAnd(i.ctx))}.<em>${esc(ctxBasis(i))}</em>` : 'No active decision context linked.', s:'Decision context'},
   {t:'Potential impact surfaced',
    d: !i.assessed ? 'No potential impact is recorded for this item.' : low ? 'No direct impact identified.' : `${esc(i.impact)}<em>Why this matters: ${esc(i.why)}</em>`, s:'Assessment'},
   {t:'Human review requested',
    d: !i.assessed ? 'No assessment or review request is recorded for this item.'
       : `${i.review==='Yes' ? 'Expert review requested.' : 'Expert review not requested.'} Assessment: ${esc(i.mat)}. AI confidence: ${esc(i.conf)}. Status: ${esc(st.label)}.`, s:'Assessment'}
  ];
}
function chainNodes(i){
  const q = Q[i.eq], g = GAPOF[i.eq], low = i.tags.includes('lowrel');
  return [
   ['Evidence', `${i.id} ${i.short}`],
   ['Endpoint or focus', i.focus],
   ['Evidence question', `${q.Question_ID} ${q.Evidence_Question}`],
   ['Evidence gap', low ? 'No gap addressed' : `${g.Evidence_Gap_ID} ${g.Gap_Name}`],
   ['Decision context', i.ctx.length ? i.ctx.slice(0,2).join(', ') + (i.ctx.length>2 ? ` +${i.ctx.length-2}` : '') : 'None active'],
   ['Potential impact', i.assessed ? i.impact : 'Not recorded']
  ];
}
function lineageNodes(i){
  const q = Q[i.eq], g = GAPOF[i.eq], low = i.tags.includes('lowrel');
  const related = ITEMS.filter(x => x.eq === i.eq && x.id !== i.id);
  return [
   {k:'source', label:'Source', main:i.title, sub:`${i.org}, ${fd(i.date)}`,
    det:[['Evidence ID',i.id],['Evidence type',i.type],['Source type',i.srcType],['Source reliability',i.reliability],['Published',fd(i.date)]]},
   {k:'finding', label:'Finding', main:i.finding, sub:`Evidence strength: ${i.strength}`,
    det:[['Population',i.population],['Endpoint or focus',i.focus],['Evidence strength',i.strength]]},
   {k:'question', label:'Evidence question', main:`${q.Question_ID} ${q.Evidence_Question}`, sub:`Status: ${q.Status}`,
    det:[['Decision objective',q.Decision_Objective],['Current gap',q.Current_Gap],['Status',q.Status]], related},
   {k:'gap', label:'Evidence gap', main: low ? 'No gap addressed' : `${g.Evidence_Gap_ID} ${g.Gap_Name}`, sub: low ? 'The finding is general and does not address a specific gap.' : `${g.Description}. Status: ${g.Status}`,
    det: low ? [] : [['Description',g.Description],['Status',g.Status],['Link basis',`Matched to ${q.Question_ID} by identifier; the question’s current gap reads “${q.Current_Gap}”.`]]},
   {k:'context', label:'Decision context', main: i.ctx.length ? i.ctx.join(', ') : 'None active', sub:'', det:[['Basis', ctxBasis(i)]]},
   {k:'impact', label:'Potential impact', main: i.assessed ? i.impact : 'Not recorded in the dataset', sub: i.assessed ? `Why this matters: ${i.why}` : '',
    det: i.assessed ? [['Materiality',i.mat],['Change severity',i.sev],['AI confidence',i.conf],['Human review',i.review==='Yes'?'Requested':'Not requested']] : []}
  ];
}

function vInvestigate(){
  const i = BYID[S.sel]; if (!i) return vMonitor();
  const list = results(), idx = list.findIndex(x => x.id === i.id);
  const q = Q[i.eq], g = GAPOF[i.eq];
  const open = !!S.why[i.id];
  const prevBase = ITEMS.filter(x => x.eq === i.eq && x.prev === 'Baseline');
  const dataNote = (i.prev === 'Baseline' && pd(i.date) > pd(PREV))
    ? `Dataset note: this item is dated ${fd(i.date)} but is recorded as Baseline at the ${fd(PREV)} snapshot. It is shown as recorded.` : '';
  const mat = [
    ['Relevance', i.tags.includes('lowrel') ? `Detected, but assessed as low relevance. ${i.why||''}` : `Linked to ${q.Question_ID} “${q.Evidence_Question}”, currently ${q.Status.toLowerCase()}.`, ''],
    ['Evidence strength', `${i.strength} evidence strength`, `${i.type}, source reliability ${i.reliability}.`],
    ['Magnitude of change', `${i.prev ? i.prev : 'No prior record'} → ${i.curr}`, i.sev ? `Change severity: ${i.sev}.` : 'Change severity is not assessed in the dataset.'],
    ['Decision proximity', i.assessed ? i.why : 'Not assessed in the dataset.', i.ctx.length ? `Decision context: ${listAnd(i.ctx)}.` : 'No active decision context linked.']
  ];
  const steps = reasoningSteps(i), chain = chainNodes(i);
  const lin = lineageNodes(i);
  const rev = S.reviews[i.id], dr = (S.draft[i.id] = S.draft[i.id] || {disp: rev ? rev.disp : null, note: rev ? rev.note : ''});

  return `<div class="wrap">
  <div class="inv-top">
    <button class="crumb" data-act="nav" data-view="monitor">${ICON.back} Change Monitor</button>
    <div class="pager" aria-label="Move between changes">${idx>=0 ? `<span>${idx+1} of ${list.length} in current view</span>
      <button data-act="step" data-dir="-1" ${idx<=0?'disabled':''}>Previous</button><button data-act="step" data-dir="1" ${idx>=list.length-1?'disabled':''}>Next</button>` : ''}</div>
  </div>
  <div class="inv-grid">
   <div class="inv-main">
    <header class="inv-head">
      <div class="tags">${typeChip(i)}${i.sev?`<span class="chip outline">${barsFor(i.sev,sevTone(i.sev))}${i.sev} severity</span>`:''}${i.mat?`<span class="chip outline">${esc(i.mat)}</span>`:`<span class="chip outline">Not assessed</span>`}</div>
      <h1>${esc(i.headline)}</h1>
      <p class="inv-sub">${esc(i.title)}</p>
      <dl class="meta">
        <div><dt>Evidence ID</dt><dd>${i.id}</dd></div><div><dt>Evidence type</dt><dd>${esc(i.type)}</dd></div>
        <div><dt>Source organisation</dt><dd>${esc(i.org)}</dd></div><div><dt>Published</dt><dd>${fd(i.date)}</dd></div>
        <div><dt>Source reliability</dt><dd>${esc(i.reliability)}</dd></div>
      </dl>
    </header>

    <section class="section" style="margin-top:32px"><div class="sec-h"><h2>What changed?</h2></div>
      <p class="prose">${esc(i.what)}</p></section>

    <section class="section" aria-labelledby="whyh" style="margin-top:32px">
     <div class="why ${open?'open':''}" id="why">
      <div class="why-h"><div><h2 id="whyh">Why was this flagged?</h2><div class="sub">From evidence to potential impact, step by step</div></div>
        <button class="why-t" data-act="why" aria-expanded="${open}" aria-controls="why-x"><span class="lbl">${open?'Hide reasoning':'Show reasoning'}</span>${ICON.chev}</button></div>
      <div class="why-b">
        <p class="prose">${esc(i.flagged)}</p>
        <ol class="chain" aria-label="Reasoning chain">${chain.map(([k,v]) => `<li><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></li>`).join('')}</ol>
        <div class="why-x" id="why-x">
          <h3>How the system reached this flag</h3>
          <ol class="steps">${steps.map((s,n) => `<li style="--i:${n}"><span class="no" aria-hidden="true">${n+1}</span><span class="st">${s.t}</span><span class="src">${s.s}</span><div class="sd">${s.d}</div></li>`).join('')}</ol>
        </div>
      </div>
     </div>
    </section>

    <section class="section" style="margin-top:40px"><div class="sec-h"><h2>Materiality: ${esc(i.mat || 'not assessed')}</h2>${i.conf?`<p>AI confidence: ${esc(i.conf)}</p>`:''}</div>
      <dl class="mat-list">${mat.map(([k,v,s]) => `<div><dt>${k}</dt><dd>${esc(v)}${s?`<small>${esc(s)}</small>`:''}</dd></div>`).join('')}</dl>
      <p class="mat-note">The four considerations show the dataset evidence behind the assessment. They are not separately scored.</p></section>

    <section class="section" style="margin-top:40px"><div class="sec-h"><h2>Previous and current evidence state</h2></div>
      <div class="compare">
        <div class="cmp prev"><h3>Previous evidence state</h3><div class="snap">${fd(PREV)}</div><dl>
          <div><dt>State of this evidence</dt><dd>${i.prev ? esc(i.prev) : 'No snapshot recorded'}</dd></div>
          <div><dt>Established evidence on ${esc(q.Question_ID)}</dt><dd>${prevBase.length ? `<div class="lst">${prevBase.map(b => `<div>${esc(b.title)}<span class="ft">${esc(b.finding)}</span></div>`).join('')}</div>` : 'None recorded'}</dd></div>
          ${dataNote && i.prev==='Baseline' ? `<div><dt>Note</dt><dd class="tone-mute">Published ${fd(i.date)}, after this snapshot.</dd></div>` : ''}
        </dl></div>
        <div class="cmp-mid" aria-hidden="true">${ICON.arrow}</div>
        <div class="cmp curr"><h3>Current evidence state</h3><div class="snap">${fd(CURR)}</div><dl>
          <div><dt>State of this evidence</dt><dd>${esc(i.curr)}</dd></div>
          <div><dt>Evidence</dt><dd>${esc(i.title)}<span class="ft">${esc(i.finding)}</span></dd></div>
          <div><dt>${esc(q.Question_ID)} and ${esc(g.Evidence_Gap_ID)}</dt><dd>Question ${esc(q.Status.toLowerCase())}. ${esc(g.Gap_Name)}: ${esc(g.Status.toLowerCase())}.</dd></div>
        </dl></div>
      </div>
      <div class="detected"><b>Change detected</b><span class="arrow">${esc(i.prev || 'No prior snapshot')} ${ICON.arrow} ${esc(i.curr)}</span><span class="chip ${i.tone}">${esc(i.changeType)}</span></div>
      ${dataNote ? `<div class="datanote">${esc(dataNote)}</div>` : ''}
    </section>

    <section class="section" style="margin-top:40px"><div class="sec-h"><h2>Evidence lineage</h2><p>Source to potential impact</p></div>
      <div class="lin-tools"><button class="link" data-act="linall">${lin.every(n => S.lin[i.id+n.k]) ? 'Collapse all' : 'Inspect all'}</button></div>
      <ol class="lin">${lin.map(n => { const o = !!S.lin[i.id+n.k]; const has = n.det.length || (n.related && n.related.length);
        return `<li><div class="lab">${n.label}</div><div class="rail-l"><i></i></div><div class="body">
          <div class="main">${esc(n.main)}</div>${n.sub?`<div class="sub">${esc(n.sub)}</div>`:''}
          ${has ? `<button class="tg" data-act="lin" data-k="${n.k}" aria-expanded="${o}" aria-controls="lin-${n.k}">${o?'Hide details':'Inspect'} ${ICON.chev}</button>
          <div class="det" id="lin-${n.k}" ${o?'':'hidden'}>
            ${n.det.length ? `<dl>${n.det.map(([k,v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>` : ''}
            ${n.related && n.related.length ? `<div class="rel"><h4>Other evidence on ${esc(q.Question_ID)}</h4><ul>${n.related.map(r => r.curr==='Existing'
              ? `<li><span class="tone-mute">${esc(r.title)}</span><span class="chip gray">Existing</span></li>`
              : `<li><button class="link" data-act="open" data-id="${r.id}">${esc(r.title)}</button><span class="chip ${r.tone}">${esc(r.curr)}</span></li>`).join('')}</ul></div>` : ''}
          </div>` : ''}</div></li>`; }).join('')}</ol>
    </section>
   </div>

   <aside class="inv-rail" aria-label="Expert review">
    <div class="review">
      <div class="rh"><h2>Expert review</h2>${statusChip(i)}</div>
      <div class="rb">
        <dl>
          <div><dt>AI assessment</dt><dd>${esc(i.mat || 'Not assessed')}</dd></div>
          <div><dt>AI confidence</dt><dd>${esc(i.conf || 'Not available')}</dd></div>
        </dl>
        <div class="focus"><h3>Suggested review focus</h3><p>${i.rf ? esc(i.rf) : 'None generated. The dataset holds no assessment for this item.'}</p></div>
        <fieldset><legend>Your disposition</legend>
          ${Object.entries(DISP).map(([k,d]) => `<label class="opt"><input type="radio" name="disp" value="${k}" ${dr.disp===k?'checked':''}>${d.label}</label>`).join('')}
        </fieldset>
        <div class="notes"><label for="note">Reviewer notes</label><textarea id="note" placeholder="Rationale, open questions, who to involve">${esc(dr.note)}</textarea></div>
        <div class="acts"><button class="btn" data-act="save" data-id="${i.id}" ${dr.disp?'':'disabled'}>${rev?'Update review':'Record review'}</button>
          ${rev ? `<button class="btn sec" data-act="clearReview" data-id="${i.id}">Clear</button>` : ''}</div>
        ${rev ? `<div class="saved">Recorded: ${esc(DISP[rev.disp].label)}${rev.at ? ' at ' + esc(new Date(rev.at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})) : ''}</div>` : ''}
        <p class="fine">The system surfaces and explains signals. Assessment, interpretation and any decision remain with the expert. Nothing here is a clinical, regulatory or strategic conclusion.</p>
      </div>
    </div>
   </aside>
  </div>
  ${footer()}</div>`;
}

/* ============================================================
   VIEW: Evidence Brief
   ============================================================ */
function vBrief(){
  const total = ITEMS.length, ch = CHANGED.length;
  const mats = CHANGED.filter(i => i.mat === 'Material'), pots = CHANGED.filter(i => i.mat === 'Potentially material');
  const tally = {awaiting:0, confirm:0, notmat:0, investigate:0, defer:0};
  REQUESTED.forEach(i => { const r = S.reviews[i.id]; if (r) tally[r.disp]++; else tally.awaiting++; });
  const grp = [
    {t:'High-severity changes', d:'Assessed as High severity. Expert review requested.', f:i=>i.sev==='High', full:true},
    {t:'Medium-severity changes', d:'Assessed as potentially material. Expert review requested.', f:i=>i.sev==='Medium', full:true},
    {t:'Strengthening evidence without an assessment', d:'Marked Strengthened in the evidence state. The dataset holds no relevance, materiality or impact assessment for these items.', f:i=>!i.assessed, full:false},
    {t:'Low-relevance signals', d:'Detected but not materially related to AX-417. No direct impact identified.', f:i=>i.sev==='Low', full:false}
  ].map(g => Object.assign(g, {items: SORTED.filter(g.f)})).filter(g => g.items.length);

  const item = i => {
    const r = S.reviews[i.id];
    return `<article class="bi"><div class="bi-h"><div><button class="link" data-act="open" data-id="${i.id}">${esc(i.title)}</button>
      <div class="bi-tags">${typeChip(i)}${i.sev?`<span class="chip outline">${barsFor(i.sev,sevTone(i.sev))}${i.sev} severity</span>`:''}${i.mat?`<span class="chip outline">${esc(i.mat)}</span>`:''}</div></div></div>
      <dl><dt>What changed</dt><dd>${esc(i.what)}</dd>
      <dt>Why it was flagged</dt><dd>${esc(i.flagged)}</dd>
      <dt>Potential impact</dt><dd>${esc(i.impact)}</dd>
      <dt>Review status</dt><dd>${statusChip(i)}${r && r.note ? `<span class="note">${esc(r.note)}</span>` : ''}</dd></dl></article>`;
  };
  const compact = i => `<li><div><button class="link" data-act="open" data-id="${i.id}">${esc(i.title)}</button><div class="tone-mute" style="font-size:12.5px;margin-top:2px">${esc(i.org)}, ${fd(i.date)}</div></div>
      <div class="why-s">${esc(i.what)}</div><div>${statusChip(i)}</div></li>`;

  return `<div class="wrap brief">
   <header class="brief-h"><h1 class="h1">Evidence Change Brief</h1>
    <p class="for">For ${esc(ASSET.Asset_ID)}, review period ${fd(PREV)} → ${fd(CURR)}</p>
    <div class="disclaimer">A starting point for expert discussion. It is not a scientific, clinical, regulatory or market-access conclusion, and every item remains subject to expert review.</div></header>

   <section class="section exec" style="margin-top:28px" aria-labelledby="ex"><div class="sec-h"><h2 id="ex">Executive view</h2></div>
    <p>${ch} of ${total} evidence items changed since the ${fd(PREV)} snapshot. ${mats.length+pots.length} are assessed as material or potentially material: ${mats.length} material and ${pots.length} potentially material.</p>
    <p>The material changes are ${esc(listAnd(mats.map(m => m.phrase)))}. ${CHANGED.filter(i=>!i.assessed).length} further items show strengthening evidence without an assessment, and ${CHANGED.filter(i=>i.sev==='Low').length} are low relevance.</p>
    <div class="tally" role="group" aria-label="Expert review status of flagged changes">
      <div><b>${tally.awaiting}</b><span>Awaiting review</span></div><div><b>${tally.confirm}</b><span>Confirmed material</span></div>
      <div><b>${tally.notmat}</b><span>Marked not material</span></div><div><b>${tally.investigate}</b><span>Investigating further</span></div>
      <div><b>${tally.defer}</b><span>Deferred</span></div></div></section>

   ${grp.map(g => `<section class="grp"><h2>${g.t} <span class="tone-mute" style="font-weight:400">(${g.items.length})</span></h2><p>${g.d}</p>
      ${g.full ? g.items.map(item).join('') : `<ul class="compact">${g.items.map(compact).join('')}</ul>`}</section>`).join('')}
   ${footer()}</div>`;
}

/* ============================================================
   Events
   ============================================================ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'nav'){ go(t.dataset.view); }
  else if (a === 'goFilter'){ S.q=''; const el=$('#q'); if (el) el.value=''; go('monitor', {filter:t.dataset.f}); }
  else if (a === 'filter'){ S.filter = t.dataset.f; renderMain(); }
  else if (a === 'clearSearch'){ S.q=''; const el=$('#q'); if (el) el.value=''; refreshResults(); }
  else if (a === 'open'){ S.sel = t.dataset.id; S.view = 'investigate'; renderMain(); renderRail(); window.scrollTo(0,0); }
  else if (a === 'step'){ const l = results(), k = l.findIndex(x => x.id === S.sel) + (+t.dataset.dir); if (l[k]){ S.sel = l[k].id; renderMain(); window.scrollTo(0,0); } }
  else if (a === 'why'){
    const w = $('#why'); const open = !w.classList.contains('open');
    w.classList.add('anim'); w.classList.toggle('open', open); S.why[S.sel] = open;
    t.setAttribute('aria-expanded', open); t.querySelector('.lbl').textContent = open ? 'Hide reasoning' : 'Show reasoning';
  }
  else if (a === 'lin'){
    const k = t.dataset.k, det = $('#lin-'+k), open = t.getAttribute('aria-expanded') !== 'true';
    S.lin[S.sel+k] = open; t.setAttribute('aria-expanded', open); det.hidden = !open;
    t.firstChild.textContent = open ? 'Hide details ' : 'Inspect ';
  }
  else if (a === 'linall'){
    const nodes = lineageNodes(BYID[S.sel]).filter(n => n.det.length || (n.related && n.related.length));
    const all = nodes.every(n => S.lin[S.sel+n.k]);
    lineageNodes(BYID[S.sel]).forEach(n => S.lin[S.sel+n.k] = !all);
    renderMain();
  }
  else if (a === 'save'){
    const id = t.dataset.id, d = S.draft[id]; if (!d || !d.disp) return;
    S.reviews[id] = {disp:d.disp, note:(d.note||'').trim(), at:Date.now()}; persist();
    $('#live').textContent = `Review recorded for ${id}: ${DISP[d.disp].label}`;
    renderMain(); renderRail();
  }
  else if (a === 'clearReview'){
    const id = t.dataset.id; delete S.reviews[id]; delete S.draft[id]; persist();
    $('#live').textContent = `Review cleared for ${id}`;
    renderMain(); renderRail();
  }
  else if (a === 'resetReviews'){ S.reviews = {}; S.draft = {}; persist(); renderMain(); renderRail(); }
});
document.addEventListener('change', e => {
  if (e.target.name === 'disp' && S.sel){
    const d = (S.draft[S.sel] = S.draft[S.sel] || {}); d.disp = e.target.value;
    const b = document.querySelector('[data-act="save"]'); if (b) b.disabled = false;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'note' && S.sel){ (S.draft[S.sel] = S.draft[S.sel] || {}).note = e.target.value; }
  if (e.target.id === 'q'){
    S.q = e.target.value;
    if (S.view !== 'monitor'){ S.view = 'monitor'; renderMain(); renderRail(); } else refreshResults();
  }
});

renderShell(); renderRail(); renderMain();
</script>
</body>
</html>
